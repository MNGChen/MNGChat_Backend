# Application identity and HTTP port (PORT is supplied by the deployment platform).
spring.application.name=chat_backend

server.port=${PORT:8080}

# PostgreSQL connection values are read from environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate updates the development schema from the entity classes.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis caches recent chat history but is not required for the database to work.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
chat.cache.max-messages=${CHAT_CACHE_MAX_MESSAGES:50}
chat.cache.ttl-days=${CHAT_CACHE_TTL_DAYS:7}

# S3-compatible object storage configuration for uploaded chat images.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.path-style-access=${AWS_S3_PATH_STYLE:true}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
